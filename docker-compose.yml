services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wardrobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wardrobe_password}
      POSTGRES_DB: ${POSTGRES_DB:-wardrobe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wardrobe} -d ${POSTGRES_DB:-wardrobe}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend-db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wardrobe}:${POSTGRES_PASSWORD:-wardrobe_password}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-wardrobe}
      PYTHONPATH: /app
      ADMIN_SUPERUSER_LOGIN: ${ADMIN_SUPERUSER_LOGIN}
      ADMIN_SUPERUSER_PASSWORD: ${ADMIN_SUPERUSER_PASSWORD}
      ADMIN_ACCESS_TOKEN_TTL_SEC: ${ADMIN_ACCESS_TOKEN_TTL_SEC:-1d}
      ADMIN_REFRESH_TOKEN_TTL_SEC: ${ADMIN_REFRESH_TOKEN_TTL_SEC:-1w}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    command: ["sh", "-c", "alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wardrobe}:${POSTGRES_PASSWORD:-wardrobe_password}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-wardrobe}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      IMAGE_PROXY_TIMEOUT_SEC: ${IMAGE_PROXY_TIMEOUT_SEC:-10}
      IMAGE_PROXY_MAX_BYTES: ${IMAGE_PROXY_MAX_BYTES:-8000000}
      IMAGE_CACHE_MAX_AGE_SEC: ${IMAGE_CACHE_MAX_AGE_SEC:-86400}
      IMAGE_CACHE_REDIS_TTL_SEC: ${IMAGE_CACHE_REDIS_TTL_SEC:-259200}
      IMAGE_RATE_LIMIT_PER_MINUTE: ${IMAGE_RATE_LIMIT_PER_MINUTE:-120}
      PRICING_BYBIT_FIAT: ${PRICING_BYBIT_FIAT:-RUB}
      PRICING_BYBIT_ASSET: ${PRICING_BYBIT_ASSET:-USDT}
      PRICING_BYBIT_WORKER_INTERVAL_SEC: ${PRICING_BYBIT_WORKER_INTERVAL_SEC:-3h}
      ADMIN_SUPERUSER_LOGIN: ${ADMIN_SUPERUSER_LOGIN}
      ADMIN_SUPERUSER_PASSWORD: ${ADMIN_SUPERUSER_PASSWORD}
      ADMIN_ACCESS_TOKEN_TTL_SEC: ${ADMIN_ACCESS_TOKEN_TTL_SEC:-1d}
      ADMIN_REFRESH_TOKEN_TTL_SEC: ${ADMIN_REFRESH_TOKEN_TTL_SEC:-1w}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      backend-db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.workers.bybit_rate_worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wardrobe}:${POSTGRES_PASSWORD:-wardrobe_password}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-wardrobe}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      PRICING_BYBIT_FIAT: ${PRICING_BYBIT_FIAT:-RUB}
      PRICING_BYBIT_ASSET: ${PRICING_BYBIT_ASSET:-USDT}
      PRICING_BYBIT_WORKER_INTERVAL_SEC: ${PRICING_BYBIT_WORKER_INTERVAL_SEC:-3h}
    depends_on:
      postgres:
        condition: service_healthy
      backend-db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  service:
    build:
      context: ./service
      dockerfile: Dockerfile
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      BACKEND_BASE_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      SOURCES_CONFIG_PATH: /app/config/sources.json
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-site:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_APP: site
    expose:
      - "80"
#    depends_on:
#      backend:
#        condition: service_healthy
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_APP: admin
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
