[Unit]
Description=Docker Engine (с лимитами памяти и без свопа)

[Service]
# Учёт памяти обязателен, чтобы systemd видел реальное потребление
# демона и его контейнеров.
MemoryAccounting=yes
# Мягкий порог: при приближении к пределу ядро начинает вытеснять
# страницы демона вместо того, чтобы доводить хост до полного OOM.
MemoryHigh=3200M
# Контейнеры не уходят в своп: при нехватке памяти их убивает ядро
# по cgroup, контейнер перезапускается, а хост остаётся доступным.
# Именно своп довёл сервер до состояния "жив, но не отвечает".
MemorySwapMax=0
# Запас под форк dockerd и его служебные процессы.
TasksMax=4096
