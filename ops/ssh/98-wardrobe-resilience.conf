# Больше одновременных неаутентифицированных соединений: поток сканирований
# не должен вытеснять административные подключения.
MaxStartups 30:30:100

# Запас одновременных сессий на пользователя.
MaxSessions 50

# Незавершённая попытка входа освобождает слот за 45 секунд, а не за две
# минуты: за это время успевает набежать десяток сканеров.
LoginGraceTime 45
